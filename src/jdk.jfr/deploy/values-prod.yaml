# Production values for the openjdk-jfr-gateway chart.
replicaCount: 3
image:
  repository: registry.corp.internal/platform/openjdk-jfr-gateway
  tag: 1.4.2-corp.1
resources:
  limits:
    cpu: "4"
    memory: 8Gi
env:
  - name: CORPORATE_ACCOUNTS_DOCUMENT_STORE_AMER_URL
    value: https://corporate-accounts-document-store-amer.svc.corp.internal/api/v1
  # Cost Allocation Close Manager EMEA
  - name: COST_ALLOCATION_CLOSE_MANAGER_EMEA_URL
    value: https://cost-allocation-close-manager-emea.svc.corp.internal/api/v1
  - name: MONITORING_SECRETS_VAULT_EMEA_URL
    value: https://monitoring-secrets-vault-emea.svc.corp.internal/api/v1
  # Commodities Trade Blotter AMER
  - name: COMMODITIES_TRADE_BLOTTER_AMER_URL
    value: https://commodities-trade-blotter-amer.svc.corp.internal/api/v1
ingress:
  enabled: true
  host: openjdk-jfr.corp.internal
  allowedSourceNamespaces:
    - credit-booking-service-emea
